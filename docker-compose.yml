# Linux-Dev-Server (srcds) für den Mac: läuft unter OrbStack/Docker als linux/amd64 via Rosetta.
# Vom Mac-Client: connect 127.0.0.1:27015
services:
  gmod:
    image: ceifa/garrysmod:debian-x64     # gleicher Branch wie der Mac-Client (x86-64), "not stable yet"
    platform: linux/amd64
    ports: ["27015:27015/udp", "27015:27015/tcp", "27005:27005/udp"]
    environment:
      PRODUCTION: "0"                     # Hot-Reload an
      GAMEMODE: sandbox
      MAP: gm_construct
      MAXPLAYERS: "4"
      ARGS: "-condebug +sv_lan 1 +rcon_password devonly"
    volumes:
      - ./:/home/gmod/server/garrysmod/addons/myphys
      - ./.dev/data:/home/gmod/server/garrysmod/data

  # Optional: zweiter Server mit VPhysics-Jolt zum Vergleich.
  # Start: docker compose --profile jolt up -d gmod-jolt   ·   connect 127.0.0.1:27016
  gmod-jolt:
    profiles: ["jolt"]
    build:
      context: docker
      dockerfile: Dockerfile.jolt
    platform: linux/amd64
    ports: ["27016:27016/udp", "27016:27016/tcp"]
    environment:
      PRODUCTION: "0"
      AUTOUPDATE: "0"                     # sonst kann das Steam-Update die Jolt-vphysics überschreiben
      PORT: "27016"
      GAMEMODE: sandbox
      MAP: gm_construct
      MAXPLAYERS: "4"
      ARGS: "-condebug +sv_lan 1 +rcon_password devonly"
    volumes:
      - ./:/home/gmod/server/garrysmod/addons/myphys
      - ./.dev/data-jolt:/home/gmod/server/garrysmod/data
